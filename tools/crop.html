<body><header class="navbar"><a href="../index.html" class="logo"><span class="logo-icon">✦</span><span>Web<span class="accent">Toolbox</span></span></a><nav class="nav-links"><a href="../index.html">首頁</a><a href="../index.html#tools">所有工具</a></nav><a class="nav-button" href="../index.html#tools">返回工具箱 ↗</a></header>
<main class="crop-page"><a class="crop-back" href="../index.html#tools">← 返回所有工具</a><div class="crop-heading"><span class="eyebrow">IMAGE / CROP</span><h1>圖片<span class="gradient-text">裁切工具</span></h1><p>自由選取裁切區域、切換比例、旋轉並下載 PNG，圖片不會上傳伺服器。</p></div>
<section class="crop-panel"><h2>01　選擇圖片</h2><input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp"><p id="fileInfo">可選 JPG、PNG、WebP，單張不超過 20 MB。</p></section>
<section class="crop-panel"><h2>02　裁切設定</h2><div class="crop-controls"><label>裁切比例 <select id="ratio"><option value="free">自由裁切</option><option value="1">1:1 正方形</option><option value="1.3333333333">4:3</option><option value="1.7777777778">16:9</option><option value="0.75">3:4</option><option value="0.5625">9:16</option></select></label><button id="rotateLeft" type="button" disabled>↶ 向左旋轉</button><button id="rotateRight" type="button" disabled>↷ 向右旋轉</button><button id="reset" type="button" disabled>重設選取</button></div><p class="crop-hint">在圖片上拖曳選取範圍，切換比例會以畫面中心重建選取框。</p><div class="crop-stage"><canvas id="cropCanvas" aria-label="圖片裁切預覽"></canvas></div><p id="cropStatus" role="status" aria-live="polite">請先選擇圖片</p><button id="download" type="button" class="crop-download" disabled>下載裁切後 PNG</button></section></main>
